<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Office Reader</title>
<link rel="stylesheet" href="viewer.css"><link rel="stylesheet" href="android.css">
</head><body>
<!-- tab strip: menu + Home + one tab per open file (SumatraPDF-style) -->
<div id="tabstrip">
  <button id="backBtn" title="Back (Alt+Left)" aria-label="Back"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M19 12H5M11 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <svg id="appico" viewBox="0 0 24 24" width="16" height="16"><rect x="2" y="2" width="20" height="20" rx="5" fill="#f5c518"/><text x="12" y="16.5" text-anchor="middle" font-size="9" font-weight="800" font-family="Segoe UI,Arial" fill="#222">RT</text></svg>
  <button id="menuBtn" title="Menu (Ctrl+O = open)" aria-label="Menu"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
  <div id="tabs" role="tablist"></div>
</div>

<!-- toolbar -->
<div id="toolbar">
  <button id="tOpen" class="ib" title="Open (Ctrl+O)"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
  <button id="tPrint" class="ib" title="Print (Ctrl+P)"><svg viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v7H7z"/></svg></button>
  <span class="sep"></span>
  <label id="pageLbl">Page:</label><input id="pageIn" type="text" inputmode="numeric" autocomplete="off"><span id="pageOf"></span>
  <button id="tPrev" class="ib" title="Previous page"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 5l-7 7 7 7"/></svg></button>
  <button id="tNext" class="ib" title="Next page"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
  <span class="sep"></span>
  <button id="tFitW" class="ib" title="Fit width"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 12h18"/></svg></button>
  <button id="tFitP" class="ib" title="Fit page"><svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="1"/></svg></button>
  <button id="tRotL" class="ib" title="Rotate left"><svg viewBox="0 0 24 24"><path d="M3 4v6h6"/><path d="M5.5 15a8 8 0 1 0 1-8L3 10"/></svg></button>
  <button id="tRotR" class="ib" title="Rotate right"><svg viewBox="0 0 24 24"><path d="M21 4v6h-6"/><path d="M18.5 15a8 8 0 1 1-1-8L21 10"/></svg></button>
  <button id="tZOut" class="ib" title="Zoom out (Ctrl + -)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5M8 11h6"/></svg></button>
  <button id="tZIn" class="ib" title="Zoom in (Ctrl + +)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5M8 11h6M11 8v6"/></svg></button>
  <span id="zv">100%</span>
  <span class="sep"></span>
  <label id="findLbl">Find:</label><input id="findIn" type="text" autocomplete="off" spellcheck="false">
  <button id="tFPrev" class="ib" title="Previous match (Shift+Enter)"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button id="tFNext" class="ib" title="Next match (Enter)"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <button id="tCase" class="ib" title="Match case"><span style="font-weight:600;font-size:13px">Aa</span></button>
  <span class="grow"></span>
  <button id="tFull" class="ib" title="Full page (F11)" aria-label="Full page"><svg id="fullIco" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<div id="stage">
  <!-- Home: Frequently Read -->
  <div id="home" class="pane on">
    <div class="brand"><span style="color:#ef4136">R</span><span style="color:#f7941d">a</span><span style="color:#f5c518">j</span><span style="color:#8dc63f">i</span><span style="color:#00a651">b</span><span style="color:#00aeef">R</span><span style="color:#2e86de">e</span><span style="color:#92278f">a</span><span style="color:#ee2a7b">d</span><span style="color:#ef4136">e</span><span style="color:#f7941d">r</span><small>Office Reader 1.0</small></div>
    <div id="homeBody">
      <h1 id="freqTitle">Frequently Read</h1>
      <div id="grid"></div>
      <div id="homeEmpty">কোনো file এখনো খোলা হয়নি। নিচে "Open a document…" চাপুন।</div>
      <a id="openDoc" href="#"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Open a document…</a>
      <div id="support">PDF · Word · Excel · PowerPoint · Image · Video · Audio · Markdown · Text</div>
    </div>
    <a id="hideFreq" href="#">Hide frequently read</a>
  </div>
  <!-- one pane per open tab is created here by viewer.js -->
  <div id="panes"></div>
  <div id="msg"></div>
  <div id="dropHint">Drop files to open</div>
</div>

<div id="menu" class="hide">
  <button data-a="open">Open…<kbd>Ctrl+O</kbd></button>
  <button data-a="close">Close tab<kbd>Ctrl+W</kbd></button>
  <button data-a="print">Print…<kbd>Ctrl+P</kbd></button>
  <button data-a="full">Full page<kbd>F11</kbd></button>
  <button data-a="default">Make default reader…</button>
  <button data-a="clear">Clear frequently-read list</button>
</div>

<input type="file" id="fi" hidden multiple accept=".pdf,.docx,.xlsx,.xls,.csv,.pptx,.png,.jpg,.jpeg,.gif,.webp,.bmp,.svg,.mp4,.webm,.mkv,.mov,.m4v,.ogv,.mp3,.wav,.ogg,.m4a,.flac,.md,.markdown,.txt,.log,.json,.xml,.ini,.cfg,.yml,.yaml">
<script src="jszip.min.js"></script>
<script src="docx-preview.min.js"></script>
<script src="xlsx.full.min.js"></script>
<script src="pptx-preview.umd.js"></script>
<script src="marked.min.js"></script>
<script src="viewer.js"></script>
</body></html>
