<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focus time 🌿</title>
<style>
:root{--bg:#0A0F1E;--sf:#111833;--sf2:#18213F;--ln:rgba(255,255,255,.08);--tx:#E9EDFA;--mu:#8B95B5;--ac:#8EA2FF;--ak:#0A0F1E;--mt:#6FE3C1}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:'Noto Sans Bengali','Hind Siliguri','Segoe UI',system-ui,sans-serif;color:var(--tx);background:radial-gradient(900px 500px at 50% -8%,#1E2A5A 0%,transparent 70%),var(--bg);padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
body.on{--ac:#8EA2FF}body.brk{--ac:var(--mt)}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px}
.brand{font-size:14px;font-weight:600;color:var(--mu);letter-spacing:.2px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:var(--sf);border:1px solid var(--ln);font-size:12.5px;font-weight:600;color:var(--mu)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--mu)}
body.on .pill,body.brk .pill{color:var(--tx)}body.on .pill i,body.brk .pill i{background:var(--ac);box-shadow:0 0 0 0 var(--ac);animation:pu 2s infinite}
@keyframes pu{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 4px}
.ring{position:relative;width:min(72vw,270px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}.trk{stroke:var(--sf2)}
.rg{stroke:var(--ac);stroke-dasharray:339.29;stroke-dashoffset:0;transition:stroke-dashoffset .6s linear,stroke .4s}
.tmw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tm{font:600 clamp(40px,13vw,56px)/1 'Segoe UI',system-ui,sans-serif;letter-spacing:1px;font-variant-numeric:tabular-nums}
.tl{margin-top:8px;font-size:13px;color:var(--mu)}
h2{margin:22px 0 8px;font-size:24px;font-weight:700;letter-spacing:-.2px}
.sub{max-width:360px;font-size:14px;line-height:1.75;color:var(--mu)}
.live{min-height:20px;margin-top:12px;font-size:13.5px;font-weight:600;color:var(--ac)}
.pm{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px 12px 18px;background:var(--sf);border:1px solid var(--ln);border-radius:16px}
.pm .pml{font-size:14px;font-weight:600}
.pm b{min-width:46px;text-align:center;font-size:20px;font-variant-numeric:tabular-nums}
.pm button{width:38px;height:38px;padding:0;border-radius:11px;font-size:20px;line-height:1}
.pm>.st{display:flex;align-items:center;gap:6px}
.pmt{min-height:16px;margin:-4px 4px 0;font-size:12.5px;color:var(--mu);text-align:center}
.fr{display:flex;flex-wrap:wrap;gap:10px}.fr button{flex:1}
button{border:0;border-radius:14px;padding:13px 18px;font:600 14.5px inherit;font-family:inherit;cursor:pointer;background:var(--sf2);color:var(--tx);transition:background .15s,transform .1s}
button:hover{background:#222E58}button:active{transform:scale(.97)}
button.p{background:var(--ac);color:var(--ak);font-size:16px;padding:16px 18px;box-shadow:0 8px 24px -10px var(--ac)}button.p:hover{filter:brightness(1.08);background:var(--ac)}
.fq{display:flex;flex-direction:column;gap:10px;padding:18px 20px;border-radius:18px;background:var(--sf);border:1px solid var(--ln);transition:opacity .5s,transform .5s}
.fq.out{opacity:0;transform:translateY(6px)}
.fq q{quotes:none;font-size:16.5px;line-height:1.75}.fq small{font-size:13px;color:var(--ac)}
.fq .g{align-self:flex-start;margin-top:4px;padding:7px 12px;font-size:12.5px;background:transparent;border:1px solid var(--ln);color:var(--mu)}
.sec{padding:16px;border-radius:18px;background:var(--sf);border:1px solid var(--ln);display:flex;flex-direction:column;gap:12px}
.sh{font-size:13px;font-weight:600;color:var(--mu)}
.sites{display:flex;flex-wrap:wrap;gap:8px}
.sites a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border-radius:11px;padding:8px 12px;font-size:13px;font-weight:600;background:var(--sf2);color:var(--tx);border:1px solid var(--ln)}
.sites a:hover{border-color:var(--ac)}.sites a i{font-style:normal;opacity:.6;margin-left:4px;cursor:pointer}.sites a i:hover{opacity:1;color:#FF9C8F}
.add{display:flex;gap:8px}.add input{flex:1;min-width:0;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:12px;padding:11px 14px;font:14px inherit;font-family:inherit;outline:0}
.add input:focus{border-color:var(--ac)}.add button{padding:11px 16px}
.lock{opacity:.5;pointer-events:none}
</style></head><body>
<main class="wrap">
<header class="top"><span class="brand">Focus Mode</span><span class="pill"><i></i><span id="pt">প্রস্তুত</span></span></header>
<section class="hero">
<div class="ring"><svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="54"/><circle class="rg" id="rg" cx="60" cy="60" r="54"/></svg>
<div class="tmw"><div class="tm" id="tm">25:00</div><div class="tl" id="tl">মিনিট</div></div></div>
<h2>এখন মনোযোগের সময়</h2>
<div class="sub">আপনি যা খুঁজছিলেন তা লক্ষ্য থেকে মনোযোগ সরিয়ে দিতে পারে। চলুন আবার পড়াশোনায় ফিরি।</div>
<div class="live" id="live"></div>
</section>
<div class="pm" id="mn"><span class="pml">সময় (মিনিট)</span><span class="st"><button id="mnM" title="কমান">−</button><b id="mnN">25</b><button id="mnP" title="বাড়ান">＋</button></span></div>
<div class="pm" id="pm"><span class="pml">Pomodoro session</span><span class="st"><button id="pmM" title="কমান">−</button><b id="pmN">1</b><button id="pmP" title="বাড়ান">＋</button></span></div>
<div class="pmt" id="pmT"></div>
<div class="fr"><button class="p" id="bt">ফোকাস শুরু</button></div>
<div class="fr" id="bk" style="display:none"><button class="p" id="bs">এখনই পরের session</button><button id="bx">Pomodoro বন্ধ</button></div>
<section class="fq" id="fq"><q id="q"></q><small id="a"></small><button class="g" id="bq">↻ আরেকটি উক্তি</button></section>
<section class="sec"><div class="sh" id="sh">অনুমোদিত ওয়েবসাইট — ক্লিক করলে এই ট্যাবেই খুলবে</div><div class="sites" id="sites"></div>
<div class="add" id="add"><input id="in" placeholder="যেমন: youtube.com" autocomplete="off"><button id="ba">যোগ</button></div></section>
<section class="sec"><div id="nz"></div></section>
</main>
<script>/*__NOISE_JS__*/</script>
<script>
const QUOTES=[
["ওঠো, জাগো এবং লক্ষ্যে না পৌঁছানো পর্যন্ত থেমো না।","rasel"],
["স্বপ্ন সেটা নয় যা তুমি ঘুমিয়ে দেখো, স্বপ্ন সেটাই যা তোমাকে ঘুমাতে দেয় না।","এ. পি. জে. আবদুল কালাম"],
["এক সময়ে একটি কাজ করো, আর তা করার সময় নিজের সমস্ত মন তাতে ঢেলে দাও।","স্বামী বিবেকানন্দ"],
["চিত্ত যেথা ভয়শূন্য, উচ্চ যেথা শির।","রবীন্দ্রনাথ ঠাকুর"],
["বল বীর — বল উন্নত মম শির!","কাজী নজরুল ইসলাম"],
["আমরা যা বারবার করি, আমরা তা-ই। তাই শ্রেষ্ঠত্ব কোনো একটি কাজ নয়, এটি একটি অভ্যাস।","অ্যারিস্টটল"],
["তুমি তোমার মনের ওপর ক্ষমতা রাখো, বাইরের ঘটনার ওপর নয়। এটা বুঝলেই তুমি শক্তি পাবে।","মার্কাস অরেলিয়াস"],
["বাস্তবের চেয়ে কল্পনাতেই আমরা বেশি কষ্ট পাই।","সেনেকা"],
["কাজটা শেষ না হওয়া পর্যন্ত সবসময় অসম্ভবই মনে হয়।","নেলসন ম্যান্ডেলা"],
["প্রকৃত শক্তিশালী সে নয় যে কুস্তিতে অন্যকে হারায়; বরং সে-ই শক্তিশালী যে রাগের সময় নিজেকে নিয়ন্ত্রণ করে।","হাদিস (বুখারি ও মুসলিম)"]];
const $=id=>document.getElementById(id);
const TOKEN='__RF_TOKEN__';
let qi=Math.floor(Math.random()*QUOTES.length),endAt=0,off=0,active=false,sites=[],tk=null;
let pomo=null,sess=1,maxS=8,mins=25,brkM=5,inited=false,wait=false,stopped=false;
const inBreak=()=>!!(pomo&&pomo.phase==='break');
function put(){$('q').textContent='“'+QUOTES[qi][0]+'”';$('a').textContent='— '+QUOTES[qi][1];$('fq').classList.remove('out')}
function nextQ(){qi=(qi+1)%QUOTES.length;$('fq').classList.add('out');setTimeout(put,450)}
async function api(path,body){
  try{const r=await fetch(path,{method:body?'POST':'GET',headers:{'x-rf-token':TOKEN,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});return await r.json()}catch(e){return null}
}
function left(){if(inBreak())return Math.max(0,Math.round((pomo.breakEndAt-(Date.now()+off))/1000));return active?Math.max(0,Math.round((endAt-(Date.now()+off))/1000)):mins*60}
function fmt(){
  const l=left();$('tm').textContent=String(Math.floor(l/60)).padStart(2,'0')+':'+String(l%60).padStart(2,'0');
  const bk0=inBreak(),tot=(bk0?brkM:mins)*60,fr=(active||bk0)&&tot?Math.min(1,l/tot):1;$('rg').style.strokeDashoffset=339.29*(1-fr);$('tl').textContent=(active||bk0)?(bk0?'বিরতি চলছে':'বাকি আছে'):'মিনিট';
  document.title=(active||inBreak())?(inBreak()?'☕ ':'')+$('tm').textContent+' · Focus time 🌿':'Focus time 🌿';
  if((active||inBreak())&&l<=0){
    if(pomo){if(!wait){wait=true;poll().then(()=>{wait=false},()=>{wait=false})}}   // the app moves on to the break / next session / end by itself
    else if(active){active=false;render();$('live').textContent='সাবাশ! ফোকাস শেষ 🎉 এবার ৫ মিনিট বিরতি নিন।'}
  }
}
function render(){
  const bk=inBreak();$('pt').textContent=bk?'বিরতি':active?'ফোকাস চলছে':'প্রস্তুত';document.body.className=bk?'brk':active?'on':'';$('bt').style.display=(active||bk)?'none':'';$('pm').style.display=(active||bk)?'none':'flex';$('mn').style.display=(active||bk)?'none':'flex';$('pmT').style.display=(active||bk)?'none':'';$('bk').style.display=bk?'flex':'none';$('add').style.display=active?'none':'flex';paintPm();
  if(active)$('live').textContent='ফোকাস চলছে — সময় শেষ না হওয়া পর্যন্ত নতুন ট্যাব ও অন্য সাইট এই পাতায় ফিরে আসবে';
  else if(left()>0&&$('live').textContent.indexOf('সাবাশ')<0)$('live').textContent='';
  if(active&&pomo)$('live').textContent='Session '+pomo.idx+'/'+pomo.total+' চলছে — সময় শেষ না হওয়া পর্যন্ত নতুন ট্যাব / অন্য সাইট এই পাতায় ফিরে আসবে';
  if(bk)$('live').textContent='বিরতি — Session '+pomo.idx+'/'+pomo.total+' শেষ। '+(pomo.idx+1)+' নম্বর session নিজে থেকেই শুরু হবে।';
  $('sh').style.display=sites.length?'':'none';
  const box=$('sites');box.textContent='';
  sites.forEach(s=>{
    const a=document.createElement('a');a.href='https://'+s+'/';a.textContent=s;
    if(!active){const x=document.createElement('i');x.textContent='✕';x.title='মুছুন';x.onclick=async e=>{e.preventDefault();e.stopPropagation();const r=await api('/api/sites',{remove:s});if(r&&r.ok){sites=r.sites;render()}};a.appendChild(x)}
    box.appendChild(a);
  });
  fmt();
}
function apply(st){if(!st)return;const was=pomo;active=!!st.active;endAt=st.endAt||0;off=(st.now||Date.now())-Date.now();sites=st.sites||[];pomo=st.pomo||null;
  if(st.maxSessions)maxS=st.maxSessions;if(st.minutes&&(!inited||st.active))mins=st.minutes;if(st.breakMinutes)brkM=st.breakMinutes;
  if(!inited){inited=true;sess=Math.min(maxS,Math.max(1,st.sessions||1))}
  render();
  if(was&&!pomo&&!active){if(stopped)$('live').textContent='';else $('live').textContent='সাবাশ! সব '+was.total+' টি session শেষ 🎉';stopped=false}
}
function paintPm(){$('mnN').textContent=mins;$('pmN').textContent=sess;$('bt').textContent=sess<2?mins+' মিনিট ফোকাস শুরু':sess+' × '+mins+' মিনিট ফোকাস শুরু';
  $('pmT').textContent=sess<2?'শুধু একটি '+mins+' মিনিটের session':'মোট '+sess+' টি session, মাঝে '+brkM+' মিনিট বিরতি (প্রায় '+(sess*mins+(sess-1)*brkM)+' মিনিট)'}
$('mnM').onclick=()=>{mins=Math.max(5,mins-5);paintPm();fmt()};
$('mnP').onclick=()=>{mins=Math.min(180,mins+5);paintPm();fmt()};
async function poll(){apply(await api('/api/state'))}
$('bt').onclick=async()=>{
  const r=await api('/api/start',{sessions:sess,minutes:mins});
  if(r&&r.ok){await poll()}else{$('live').textContent='শুরু করা যায়নি — Rajib Tutorial অ্যাপ চালু আছে কি না দেখুন।'}
};
$('ba').onclick=async()=>{const v=$('in').value.trim();if(!v)return;const r=await api('/api/sites',{add:v});if(r&&r.ok){sites=r.sites;$('in').value='';render()}else $('live').textContent='সঠিক ওয়েবসাইট লিখুন (যেমন example.com)'};
$('in').onkeydown=e=>{if(e.key==='Enter')$('ba').click()};
$('bq').onclick=nextQ;
if(window.FocusNoise)FocusNoise.mount($('nz'),{theme:'dark',lang:'bn'});
$('pmM').onclick=()=>{if(sess>1){sess--;paintPm()}};$('pmP').onclick=()=>{if(sess<maxS){sess++;paintPm()}};
$('bs').onclick=async()=>{await api('/api/pomo',{action:'skip'});poll()};
$('bx').onclick=async()=>{stopped=true;await api('/api/pomo',{action:'stop'});poll()};
put();setInterval(nextQ,12000);setInterval(fmt,500);setInterval(poll,3000);poll();
</script></body></html>
