<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src https: blob:; frame-src https: blob:; object-src blob:; connect-src 'self' blob:;">
<title>Rajib Tutorial</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="side">
  <div class="brand">🎓 Rajib Tutorial</div>
  <nav class="nav">
    <button data-v="home">🏠 Home</button>
    <button data-v="native">📱 Native Section</button>
    <button data-v="web">🌐 Web Section</button>
    <button data-v="study">🧰 Study Tools</button>
    <button data-v="focus">🎯 Focus Mode</button>
  </nav>
  <div class="ver" id="ver"></div>
</aside>
<main class="main">
  <section id="pane-home" class="pane"></section>
  <section id="pane-native" class="pane"></section>
  <section id="pane-web" class="pane nopad"></section>
  <section id="pane-study" class="pane"></section>
  <section id="pane-focus" class="pane"></section>
</main>
<div id="lock" class="lock" hidden>
  <div class="lockbox">
    <div class="lt">🔒 Focus Mode</div>
    <div class="lc" id="lockClock">--:--:--</div>
    <div class="ls">Stay focused. The app unlocks when the timer ends.</div>
    <div class="lrow"><input id="lockPin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN to stop early"><button id="lockStop" class="btn">Stop</button></div>
    <div class="err" id="lockErr"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="../node_modules/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="../node_modules/qrcode-generator/qrcode.js"></script>
<script src="app.js"></script>
<script src="native.js"></script>
</body>
</html>
