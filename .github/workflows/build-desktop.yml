name: Build Windows Desktop App

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/build-desktop.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: RajibTutorial-Windows-Setup
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
