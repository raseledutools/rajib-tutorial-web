name: Build Website EXE (installer + auto-update release)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web-exe/**', '.github/workflows/build-web-exe.yml']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: web-exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Download yt-dlp.exe so YouTube lessons can be saved offline
      - name: Download yt-dlp.exe
        shell: bash
        run: |
          mkdir -p bin
          curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -o bin/yt-dlp.exe
          echo "yt-dlp size: $(wc -c < bin/yt-dlp.exe) bytes"
      # Every build gets a new, higher version (1.0.<run number>) so installed apps see it as an update.
      - name: Set version
        shell: bash
        run: |
          echo "APP_VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
      # Build the NSIS installer (+ latest.yml / blockmap that the auto-updater reads).
      - name: Build installer
        shell: bash
        run: npx electron-builder --win nsis --x64 --publish never -c.extraMetadata.version=$APP_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: RajibTutorial-Setup
          path: web-exe/dist/RajibTutorial-Setup.exe
      # Fixed release "web-exe-latest": direct download link AND the update feed
      # (the APK workflow creates its own v<N> releases, so we keep the exe separate).
      - name: Publish to web-exe-latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view web-exe-latest >/dev/null 2>&1 || gh release create web-exe-latest --title "Website EXE (latest)" --notes "Windows installer of Rajib Tutorial. Installed apps update themselves from this release." --latest=false
          gh release upload web-exe-latest dist/RajibTutorial-Setup.exe dist/RajibTutorial-Setup.exe.blockmap dist/latest.yml --clobber
          gh release edit web-exe-latest --notes "Latest version: $APP_VERSION. Installed apps update themselves from this release."
