name: Build Website EXE (installer + auto-update release)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web-exe/**', '.github/workflows/build-web-exe.yml']

env:
  # TESTING MODE: ffmpeg is left out of the installer (much smaller + faster build/update).
  # Without it YouTube lessons still save, but as one ready-made mp4 (usually 360p) instead of merged 720p.
  # Set to 'true' before the final release to bundle ffmpeg.exe again.
  BUNDLE_FFMPEG: 'false'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: web-exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # ffmpeg.exe: lets yt-dlp merge YouTube video+audio (720p) so offline save works for every YouTube lesson.
      - name: Get ffmpeg.exe
        if: env.BUNDLE_FFMPEG == 'true'
        shell: bash
        run: |
          curl -L --fail --retry 3 -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip
          7z e ff.zip "*/bin/ffmpeg.exe" -obin -y
          ls -la bin
      - name: Leave ffmpeg out of the installer (testing mode)
        if: env.BUNDLE_FFMPEG != 'true'
        shell: bash
        run: |
          node -e "const fs=require('fs'),j=JSON.parse(fs.readFileSync('package.json','utf8'));j.build.extraResources=(j.build.extraResources||[]).filter(x=>!/ffmpeg/.test(x.from));fs.writeFileSync('package.json',JSON.stringify(j,null,2))"
          grep -c ffmpeg package.json || true
      # Every build gets a new, higher version (1.0.<run number>) so installed apps see it as an update.
      - name: Set version
        shell: bash
        run: |
          echo "APP_VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
      # Build the NSIS installer (+ latest.yml / blockmap that the auto-updater reads).
      - name: Build installer
        shell: bash
        run: npx electron-builder --win nsis --x64 --publish never -c.extraMetadata.version=$APP_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: RajibTutorial-Setup
          path: web-exe/dist/RajibTutorial-Setup.exe
      # Fixed release "web-exe-latest": direct download link AND the update feed
      # (the APK workflow creates its own v<N> releases, so we keep the exe separate).
      - name: Publish to web-exe-latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view web-exe-latest >/dev/null 2>&1 || gh release create web-exe-latest --title "Website EXE (latest)" --notes "Windows installer of Rajib Tutorial. Installed apps update themselves from this release." --latest=false
          gh release upload web-exe-latest dist/RajibTutorial-Setup.exe dist/RajibTutorial-Setup.exe.blockmap dist/latest.yml --clobber
          gh release edit web-exe-latest --notes "Latest version: $APP_VERSION. Installed apps update themselves from this release."
