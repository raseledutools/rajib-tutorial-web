name: Build Website EXE (installer + auto-update release)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web-exe/**', '.github/workflows/build-web-exe.yml']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: web-exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Every build gets a new, higher version (1.0.<run number>) so installed apps see it as an update.
      - name: Set version
        shell: bash
        run: |
          echo "APP_VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
      # Builds the NSIS installer and publishes release v<version> with
      # RajibTutorial-Setup.exe + latest.yml + blockmap (what the auto-updater reads).
      - name: Build and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --win nsis --x64 --publish always -c.extraMetadata.version=$APP_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: RajibTutorial-Setup
          path: web-exe/dist/RajibTutorial-Setup.exe
