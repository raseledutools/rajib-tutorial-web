name: Sync Firestore (primary ⇄ backup)

on:
  schedule:
    # Runs right AFTER the daily Spark quota reset (07:00 UTC summer / 08:00 UTC winter), while the primary project can still be
    # read: 08:30 UTC = 14:30 Bangladesh time. (Once a project's quota is gone nothing can be copied from it any more.)
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (count only, write nothing)'
        type: boolean
        default: false

concurrency:
  group: firestore-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install firebase-admin
        run: npm install --no-save --no-package-lock --prefix scripts firebase-admin@12.7.0

      - name: Reconcile primary ⇄ backup
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_BACKUP: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BACKUP }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/sync_firestore.js
