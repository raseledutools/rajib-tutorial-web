name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Accept Android licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Restore release keystore from secret
        run: |
          mkdir -p $HOME/.android
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > $HOME/.android/rajib-release.jks
          echo "Keystore size: $(wc -c < $HOME/.android/rajib-release.jks) bytes"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Set version from run number
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.${{ github.run_number }}"
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          sed -i "s/buildConfigField \"int\", \"VERSION_CODE\", \"[0-9]*\"/buildConfigField \"int\", \"VERSION_CODE\", \"$VERSION_CODE\"/" android/app/build.gradle
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "TAG=v$VERSION_CODE" >> $GITHUB_ENV

      - name: Build Release APK
        working-directory: android
        env:
          STORE_FILE: /home/runner/.android/rajib-release.jks
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASS }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASS }}
        run: ./gradlew assembleRelease --no-daemon 2>&1 | tee /tmp/gradle_output.txt; exit ${PIPESTATUS[0]}

      - name: Rename APK
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk RajibTutorial.apk
            echo "✅ Signed APK found"
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk RajibTutorial.apk
            echo "⚠️ Only unsigned APK found"
          else
            echo "❌ APK not found!"
            find android/app/build/outputs/ -name "*.apk" 2>/dev/null
            exit 1
          fi
          echo "APK: $(ls -lh RajibTutorial.apk)"

      - name: Push error log on failure
        if: failure()
        run: |
          cp /tmp/gradle_output.txt gradle-error.txt
          git config user.email "ci@github.com"
          git config user.name "GitHub CI"
          git add gradle-error.txt
          git commit -m "ci: gradle error log [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RajibTutorial-${{ env.TAG }}
          path: RajibTutorial.apk
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Rajib Tutorial ${{ env.VERSION_NAME }}"
          body: |
            ## Rajib Tutorial ${{ env.VERSION_NAME }}

            নতুন আপডেট। নিচের **APK download** করে install করুন।

            > ✅ পুরনো version uninstall **না করেই** install করা যাবে।
            > ⚠️ প্রথমবার install করতে **"Unknown sources থেকে install"** allow করতে হবে।

            - Version: ${{ env.VERSION_NAME }}
            - Build: #${{ github.run_number }}
            - Commit: ${{ github.sha }}
          files: RajibTutorial.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
