plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rajibtutorial'
    compileSdk 34

    defaultConfig {
        applicationId "com.rajibtutorial"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"

        buildConfigField "String", "GITHUB_OWNER", '"raseledutools"'
        buildConfigField "String", "GITHUB_REPO",  '"rajib-tutorial-web"'
        buildConfigField "int",    "VERSION_CODE", "2"

        // Twilio token endpoint (https). Supplied by CI secret TWILIO_TOKEN_URL.
        def twilioUrl = System.getenv("TWILIO_TOKEN_URL") ?: ""
        buildConfigField "String", "TWILIO_TOKEN_URL", "\"" + twilioUrl + "\""

        // Push is now handled via AdminBridge (Java → FCM REST) — no backend URL needed
    }

    signingConfigs {
        release {
            def envStoreFile = System.getenv("STORE_FILE")
            def envStorePass = System.getenv("STORE_PASS")
            def envKeyAlias  = System.getenv("KEY_ALIAS")
            def envKeyPass   = System.getenv("KEY_PASS")

            def resolvedStoreFile = (envStoreFile != null && !envStoreFile.isEmpty())
                ? envStoreFile
                : (System.getProperty("user.home") + "/.android/debug.keystore")
            def resolvedStorePass = (envStorePass != null && !envStorePass.isEmpty()) ? envStorePass : "android"
            def resolvedKeyAlias  = (envKeyAlias  != null && !envKeyAlias.isEmpty())  ? envKeyAlias  : "androiddebugkey"
            def resolvedKeyPass   = (envKeyPass   != null && !envKeyPass.isEmpty())   ? envKeyPass   : "android"

            storeFile     file(resolvedStoreFile)
            storePassword resolvedStorePass
            keyAlias      resolvedKeyAlias
            keyPassword   resolvedKeyPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.twilio:voice-android:6.3.0'

    // Admin push notifications (works only once google-services.json is added)
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-firestore'
}

// Apply the Google services plugin only when google-services.json exists,
// so the build keeps working before Firebase is configured.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
