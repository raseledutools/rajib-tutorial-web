plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rajibtutorial'
    compileSdk 34

    defaultConfig {
        applicationId "com.rajibtutorial"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"

        buildConfigField "String", "GITHUB_OWNER", '"raseledutools"'
        buildConfigField "String", "GITHUB_REPO",  '"rajib-tutorial-web"'
        buildConfigField "int",    "VERSION_CODE", "2"

        // Twilio token endpoint (https). Supplied by CI secret TWILIO_TOKEN_URL.
        def twilioUrl = System.getenv("TWILIO_TOKEN_URL") ?: ""
        buildConfigField "String", "TWILIO_TOKEN_URL", "\"" + twilioUrl + "\""
    }

    signingConfigs {
        release {
            def envStoreFile = System.getenv("STORE_FILE")
            def envStorePass = System.getenv("STORE_PASS")
            def envKeyAlias  = System.getenv("KEY_ALIAS")
            def envKeyPass   = System.getenv("KEY_PASS")

            storeFile     file(envStoreFile != null ? envStoreFile : (System.getProperty("user.home") + "/.android/debug.keystore"))
            storePassword envStorePass != null ? envStorePass : "android"
            keyAlias      envKeyAlias  != null ? envKeyAlias  : "androiddebugkey"
            keyPassword   envKeyPass   != null ? envKeyPass   : "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.twilio:voice-android:6.3.0'
}
