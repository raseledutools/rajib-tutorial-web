plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rajibtutorial'
    compileSdk 34

    defaultConfig {
        applicationId "com.rajibtutorial"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"

        buildConfigField "String", "GITHUB_OWNER", '"raseledutools"'
        buildConfigField "String", "GITHUB_REPO",  '"rajib-tutorial-web"'
        buildConfigField "int",    "VERSION_CODE", "2"

        // Twilio token endpoint (https). Supplied by CI secret TWILIO_TOKEN_URL.
        def twilioUrl = System.getenv("TWILIO_TOKEN_URL") ?: ""
        buildConfigField "String", "TWILIO_TOKEN_URL", "\"" + twilioUrl + "\""

        // Push is now handled via AdminBridge (Java → FCM REST) — no backend URL needed
    }

    signingConfigs {
        release {
            def envStoreFile = System.getenv("STORE_FILE")
            def envStorePass = System.getenv("STORE_PASS")
            def envKeyAlias  = System.getenv("KEY_ALIAS")
            def envKeyPass   = System.getenv("KEY_PASS")

            def resolvedStoreFile = (envStoreFile != null && !envStoreFile.isEmpty())
                ? envStoreFile
                : (System.getProperty("user.home") + "/.android/debug.keystore")
            def resolvedStorePass = (envStorePass != null && !envStorePass.isEmpty()) ? envStorePass : "android"
            def resolvedKeyAlias  = (envKeyAlias  != null && !envKeyAlias.isEmpty())  ? envKeyAlias  : "androiddebugkey"
            def resolvedKeyPass   = (envKeyPass   != null && !envKeyPass.isEmpty())   ? envKeyPass   : "android"

            storeFile     file(resolvedStoreFile)
            storePassword resolvedStorePass
            keyAlias      resolvedKeyAlias
            keyPassword   resolvedKeyPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true    // NewPipeExtractor needs java.time etc. below API 33
    }

    buildFeatures {
        buildConfig true
    }

    configurations.all {
        // (Firestore SDK removed: the app talks to Firestore over REST via Fs.java, so there is no
        //  protobuf-javalite 3.x vs 4.x (NewPipeExtractor) conflict any more.)
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    // Study Tools (native): PDF merge/split/compress/create + QR encode/decode, all offline
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.twilio:voice-android:6.3.0'

    // Admin push notifications (works only once google-services.json is added)
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging'
    // Background update check while the app is closed
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.google.guava:listenablefuture:1.0'   // work-runtime API needs this class at compile time
    implementation 'com.google.guava:guava:31.1-android'   // ListenableFuture (needed to compile WorkManager's Worker)

    // YouTube lesson save (Android counterpart of the exe's yt-dlp): resolves a watch URL to a direct MP4
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.27.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.4'
}

// Apply the Google services plugin only when google-services.json exists,
// so the build keeps working before Firebase is configured.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
