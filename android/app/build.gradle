plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rajibtutorial'
    compileSdk 34

    defaultConfig {
        applicationId "com.rajibtutorial"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"

        // Update checker এর জন্য — GitHub repo info
        buildConfigField "String", "GITHUB_OWNER", '"raseledutools"'
        buildConfigField "String", "GITHUB_REPO", '"rajib-tutorial-web"'
        buildConfigField "int", "VERSION_CODE", "2"
    }

    signingConfigs {
        release {
            // Debug keystore দিয়ে sign করা হবে — install হবে কিন্তু Play Store এ দেওয়া যাবে না
            storeFile file(System.getenv("HOME") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    // Kotlin stdlib duplicate class fix
    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.13.1'
}
