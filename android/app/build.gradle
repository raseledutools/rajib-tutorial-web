plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rajibtutorial'
    compileSdk 34

    defaultConfig {
        applicationId "com.rajibtutorial"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"

        buildConfigField "String", "GITHUB_OWNER", '"raseledutools"'
        buildConfigField "String", "GITHUB_REPO",  '"rajib-tutorial-web"'
        buildConfigField "int",    "VERSION_CODE", "2"
    }

    signingConfigs {
        release {
            // CI: env variable থেকে নেওয়া হয়
            // Local build: debug keystore fallback
            def storeFilePath = System.getenv("STORE_FILE") ?:
                (System.getProperty("user.home") + "/.android/debug.keystore")
            def storePassword = System.getenv("STORE_PASS") ?: "android"
            def keyAlias      = System.getenv("KEY_ALIAS")  ?: "androiddebugkey"
            def keyPassword   = System.getenv("KEY_PASS")   ?: "android"

            storeFile     file(storeFilePath)
            storePassword storePassword
            keyAlias      keyAlias
            keyPassword   keyPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.13.1'
}
