plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rajibtutorial'
    compileSdk 34

    defaultConfig {
        applicationId "com.rajibtutorial"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"

        // Update checker এর জন্য — GitHub repo info
        buildConfigField "String", "GITHUB_OWNER", '"raseledutools"'
        buildConfigField "String", "GITHUB_REPO", '"rajib-tutorial-web"'
        buildConfigField "int", "VERSION_CODE", "2"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22'
        }
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.13.1'
}
